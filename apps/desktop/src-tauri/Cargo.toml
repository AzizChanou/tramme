[package]
name = "tramme-desktop"
version = "0.4.0"
description = "the tramme editor as a native app"
edition = "2021"
default-run = "tramme-desktop"

[lib]
name = "tramme_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
dirs = "6"
unicode-normalization = "0.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
regex = "1"
base64 = "0.22"
url = "2"

[dev-dependencies]
tempfile = "3"
